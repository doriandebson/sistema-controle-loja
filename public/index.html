<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Loja</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- Estrutura Principal da Aplicação -->
    <div id="app">
        <h1>Sistema de Controle de Loja</h1>

        <!-- Tabelas e Formulários são renderizados aqui -->
        
    </div>

    <!-- Modal de Ajuste de Estoque -->
    <div id="modalEstoque" class="modal">
        <div class="modal-content">
            <h3>Ajustar Estoque: <span id="modalNomeProduto"></span></h3>
            <input type="hidden" id="modal_prod_id">
            
            <label for="modal_tipo_ajuste">Tipo de Ajuste:</label>
            <select id="modal_tipo_ajuste">
                <option value="SOMAR">Somar (+)</option>
                <option value="SUBTRAIR">Subtrair (-)</option>
                <option value="DEFINIR">Definir Valor Exato</option>
            </select>

            <label for="modal_qtd_ajuste">Quantidade:</label>
            <input type="number" id="modal_qtd_ajuste" min="1" value="1">

            <div class="modal-actions">
                <button onclick="confirmarAjusteEstoque()" class="btn btn-primary">Salvar</button>
                <button onclick="fecharModalEstoque()" class="btn btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- O JavaScript completo deve ser carregado via app.js -->
    <script src="/app.js"></script>
</body>
</html>
