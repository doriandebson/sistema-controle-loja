<!-- EMISSÃO DE VENDA E RELATÓRIO DE ESTOQUE -->
<section id="sec-vendas" class="section-panel">
    <div class="page-header">
        <h2>Emissão de Venda & Relatório de Estoque</h2>
        <p>Registre vendas com forma de pagamento, quitação e atualização de estoque.</p>
    </div>

    <div class="card">
        <h3 class="card-title">Emitir Venda</h3>
        <form id="formVenda" onsubmit="emitirVenda(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="venda_cliente">Cliente</label>
                    <select id="venda_cliente" required>
                        <option value="">Selecione o cliente...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="venda_produto">Produto</label>
                    <select id="venda_produto" required onchange="atualizarPrecoProduto()">
                        <option value="">Selecione o produto...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="venda_qtd">Quantidade *</label>
                    <input type="number" id="venda_qtd" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label for="venda_preco">Preço Unitário (R$) *</label>
                    <input type="number" step="0.01" id="venda_preco" required>
                </div>
                <div class="form-group">
                    <label for="venda_pagamento">Forma de Pagamento *</label>
                    <select id="venda_pagamento" required>
                        <option value="Pix">Pix</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Cartão de Débito">Cartão de Débito</option>
                        <option value="Boleto">Boleto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="venda_status">Status do Pagamento *</label>
                    <select id="venda_status" required>
                        <option value="PAGO">Pago (Quitado)</option>
                        <option value="PENDENTE">Pendente (A Receber)</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-secondary">Finalizar Venda</button>
        </form>
    </div>

    <div class="card">
        <h3 class="card-title">Relatório de Posição de Estoque</h3>
        <div class="table-responsive">
            <table id="tblEstoque">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Estoque Atual</th>
                        <th>Preço Venda</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</section>
